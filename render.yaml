# Render Blueprint: free PostgreSQL database + Flask web service.
databases:
  - name: conference-db
    plan: free
    databaseName: conference_db
    user: conf

services:
  - type: web
    name: conference-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conference-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
