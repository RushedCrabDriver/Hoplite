{% extends "base.html" %}
{% block content %}
<h1>{{ action }} review</h1>
<form method="post">
 <label>Paper <select name="paper_id" required><option value="">--</option>
  {% for p in papers %}<option value="{{ p.paper_id }}" {{ 'selected' if r.get('paper_id')|string == p.paper_id|string }}>{{ p.paper_id }} - {{ p.title }}</option>{% endfor %}
 </select></label>
 <label>Reviewer <select name="reviewer_id" required><option value="">--</option>
  {% for v in reviewers %}<option value="{{ v.reviewer_id }}" {{ 'selected' if r.get('reviewer_id')|string == v.reviewer_id|string }}>{{ v.reviewer_id }} - {{ v.name }}</option>{% endfor %}
 </select></label>
 <label>Overall score (1-5) <input type="number" name="overall_score" value="{{ r.get('overall_score') or '' }}" required></label>
 <label>Recommendation <select name="recommendation">
  {% for rec in ['accept', 'reject'] %}<option {{ 'selected' if r.get('recommendation') == rec }}>{{ rec }}</option>{% endfor %}
 </select></label>
 <label>Comments for authors <textarea name="comments_for_authors" rows="4" required>{{ r.get('comments_for_authors') or '' }}</textarea></label>
 <label>Confidential comments (optional) <textarea name="confidential_comments" rows="2">{{ r.get('confidential_comments') or '' }}</textarea></label>
 <label>Review submission date <input type="date" name="review_submission_date" value="{{ r.get('review_submission_date') or '' }}" required></label>
 <p><button type="submit">{{ action }}</button></p>
</form>
{% endblock %}
